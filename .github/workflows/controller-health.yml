name: Controller Health Check

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  # Allow manual triggering for debugging
  workflow_dispatch:

# Only run on the real repo — forks and mirrors skip this entirely.
# The check is inside the job rather than at the workflow level so that
# workflow_dispatch still shows up in the UI on any fork (it just exits early).

jobs:
  health-check:
    name: Check repath-controller status
    runs-on: ubuntu-latest
    if: github.repository == 'repathhq/repath'

    permissions:
      issues: write
      id-token: write

    env:
      AWS_REGION: ap-south-1

    steps:
      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check controller container health via SSM
        id: status
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker inspect --format={{.State.Health.Status}} repath-controller 2>&1 || echo not-found"]' \
            --query "Command.CommandId" --output text)

          for i in $(seq 1 12); do
            sleep 5
            STATUS_CHECK=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            if [[ "$STATUS_CHECK" == "Success" || "$STATUS_CHECK" == "Failed" ]]; then break; fi
          done

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text)
          echo "status_output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if echo "$OUTPUT" | grep -q "healthy"; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if controller is down
        if: steps.status.outputs.healthy == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: without the label, `gh issue create --label` fails and
          # the very first outage would have gone unreported.
          gh label create controller-down --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Controller health check failing" --force >/dev/null
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label "controller-down" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open — adding comment."
            gh issue comment "$EXISTING" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$(cat <<'BODY'
          Still down at ${{ github.run_id }} ($(date -u +"%Y-%m-%dT%H:%M:%SZ")).

          **docker health status:**
          \`\`\`
          ${{ steps.status.outputs.status_output }}
          \`\`\`
          BODY
          )"
          else
            echo "No open issue found — creating one."
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "🚨 Controller down" \
              --label "controller-down" \
              --body "$(cat <<'BODY'
          ## Controller health check failed

          The `repath-controller` container on EC2 is not reporting healthy.

          **Detected at:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **docker health status:**
          \`\`\`
          ${{ steps.status.outputs.status_output }}
          \`\`\`

          ### Recovery steps
          1. Connect via `aws ssm start-session --target <instance-id>` (no SSH key needed)
          2. `docker ps -a` / `docker logs repath-controller` — check for panic / OOM
          3. `docker compose -f /opt/repath/docker-compose.prod.yml restart controller`
          4. If crash-looping, check the `REPATH_DATABASE_URL` SSM parameter and recent deploys
          BODY
          )"
          fi

      - name: Log healthy status
        if: steps.status.outputs.healthy == 'true'
        run: echo "Controller is healthy."

      # The judge is what makes a rollout decision mean anything, and it can
      # fail while every container stays healthy: on 2026-10-02 the OpenAI
      # balance was found empty, every judge call returning 429, and nothing
      # had noticed. A one-token call with the evaluator's own key catches an
      # empty balance, a revoked key or a retired judge model within minutes,
      # for well under a cent a day.
      - name: Check the LLM judge can score
        id: judge
        run: |
          # The evaluator's own settings and request shape, so this tests what
          # judging actually does — endpoint, key and model — not a stand-in.
          PROBE=$(base64 -w0 <<'PY'
          from openai import OpenAI
          from repath_evaluators.config import settings
          from repath_evaluators.evaluators.llm_judge import request_options
          model = settings.llm_judge_model
          via = settings.llm_judge_base_url or "openai"
          try:
              client = OpenAI(api_key=settings.llm_judge_api_key or settings.openai_api_key,
                              base_url=settings.llm_judge_base_url or None, timeout=30)
              client.chat.completions.create(
                  model=model,
                  messages=[{"role": "user", "content": 'Reply in JSON: {"ok": true}'}],
                  response_format={"type": "json_object"},
                  **request_options(model))
              print("JUDGE_OK", model, "via", via)
          except Exception as e:
              code = getattr(e, "code", None) or getattr(e, "type", None) or type(e).__name__
              print("JUDGE_DOWN", getattr(e, "status_code", ""), code, model, "via", via, str(e)[:160])
          PY
          )
          CMD="echo $PROBE | base64 -d | docker exec -i repath-evaluator python -"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -n --arg c "$CMD" '{commands:[$c]}')" \
            --query "Command.CommandId" --output text)
          for i in $(seq 1 12); do
            sleep 5
            S=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            if [[ "$S" == Success || "$S" == Failed ]]; then break; fi
          done
          OUTPUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" --query StandardOutputContent --output text)
          echo "result=$(echo "$OUTPUT" | tr -d '\n' | head -c 300)" >> "$GITHUB_OUTPUT"
          if echo "$OUTPUT" | grep -q JUDGE_OK; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Open issue if the judge cannot score
        if: steps.judge.outputs.ok == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.judge.outputs.result }}
        run: |
          gh label create judge-down --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "LLM judge cannot score (credit, key, model)" --force >/dev/null
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label judge-down --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still failing at $(date -u +%FT%TZ): \`$RESULT\`"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label judge-down \
              --title "🚨 LLM judge cannot score — rollouts cannot advance" \
              --body "$(printf '%s\n' \
                "The production judge call failed: \`$RESULT\`" "" \
                "While this lasts, no response is judged: rollouts hold (they never advance on unjudged traffic) and judge-based rollback cannot trigger." "" \
                "- No credit (\`insufficient_quota\`, \`credit_balance_exhausted\`, 402): top up the account the judge runs on — the Vercel AI Gateway (vercel.com → AI Gateway) when REPATH_LLM_JUDGE_BASE_URL is set, otherwise OpenAI billing" \
                "- \`invalid_api_key\` / 401: set the new key as llm_judge_api_key (or openai_api_key) in infra/terraform.tfvars, terraform apply, then redeploy" \
                "- \`model_not_found\` / 404: the judge model was retired; change llm_judge_model in Terraform" "" \
                "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
          fi

      - name: Close the judge issue once it recovers
        if: steps.judge.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label judge-down --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Judge recovered at $(date -u +%FT%TZ)."
          done
